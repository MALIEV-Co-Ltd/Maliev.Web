name: Build and Test

on:
  workflow_call:
    inputs:
      solution_file:
        required: true
        type: string
    outputs:
      messaging-contracts-version:
        description: Exact locally reconstructed MessagingContracts package version
        value: ${{ jobs.dependency-packages.outputs.messaging-contracts-version }}
      service-defaults-version:
        description: Exact locally reconstructed ServiceDefaults package version
        value: ${{ jobs.dependency-packages.outputs.service-defaults-version }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  dependency-packages:
    name: Build exact public-source dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      messaging-contracts-version: ${{ steps.package-versions.outputs.messaging-contracts-version }}
      service-defaults-version: ${{ steps.package-versions.outputs.service-defaults-version }}
    steps:
      - name: Checkout Web source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout exact MessagingContracts source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: d4836f135d1cf311b2a490d9ba03809ff295e854
          path: .ci-sources/Maliev.MessagingContracts
          persist-credentials: false

      - name: Checkout exact ServiceDefaults source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 7121d57705fc1eff6c7ebb6a69e33e9c26ebfccc
          path: .ci-sources/Maliev.Aspire
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build exact dependency packages
        id: package-versions
        run: bash scripts/prepare-web-ci-packages.sh

      - name: Upload exact dependency packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-ci-packages
          path: .ci-packages/*.nupkg
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  build-and-test:
    name: Release build and test
    needs: dependency-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHARED_LIBRARY_VERSION: ${{ needs.dependency-packages.outputs.service-defaults-version }}
      MESSAGING_CONTRACTS_VERSION: ${{ needs.dependency-packages.outputs.messaging-contracts-version }}
    steps:
      - name: Checkout Web source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Download exact dependency packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: web-ci-packages
          path: .ci-packages

      - name: Restore
        run: >-
          dotnet restore ${{ inputs.solution_file }}
          --configfile NuGet.PRValidation.Config
          /p:GITHUB_ACTIONS=true
          /p:SharedLibraryVersion="${SHARED_LIBRARY_VERSION}"
          /p:MessagingContractsVersion="${MESSAGING_CONTRACTS_VERSION}"

      - name: Build
        run: dotnet build ${{ inputs.solution_file }} --configuration Release --no-restore /p:GITHUB_ACTIONS=true /p:SharedLibraryVersion="${SHARED_LIBRARY_VERSION}" /p:MessagingContractsVersion="${MESSAGING_CONTRACTS_VERSION}"

      - name: Test
        run: dotnet test ${{ inputs.solution_file }} --configuration Release --no-build --verbosity normal /p:GITHUB_ACTIONS=true /p:SharedLibraryVersion="${SHARED_LIBRARY_VERSION}" /p:MessagingContractsVersion="${MESSAGING_CONTRACTS_VERSION}"
