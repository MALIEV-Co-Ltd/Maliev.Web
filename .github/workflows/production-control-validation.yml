name: Validate Production Promotion Controls

on:
  pull_request:
    paths:
      - .github/workflows/promote-production.yml
      - .github/workflows/production-control-validation.yml
      - scripts/ensure-web-image-tag.sh
      - scripts/update-web-gitops-overlay.sh
      - scripts/verify-web-image-attestations.sh
      - scripts/tests/production-promotion-controls.test.sh

permissions:
  contents: read

concurrency:
  group: production-control-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Web source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check production control shell syntax
        shell: bash
        run: |
          bash -n scripts/ensure-web-image-tag.sh \
            scripts/update-web-gitops-overlay.sh \
            scripts/verify-web-image-attestations.sh \
            scripts/tests/production-promotion-controls.test.sh

      - name: Run production promotion control fixture
        shell: bash
        run: bash scripts/tests/production-promotion-controls.test.sh
